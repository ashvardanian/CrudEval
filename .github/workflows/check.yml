name: Check
on: [push, pull_request]
jobs:
  check:
    name: Check on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
      - name: Install Rust 1.100 with Rustfmt and Clippy
        run: rustup toolchain install beta-2026-10-18 --profile minimal --component rustfmt,clippy
      - name: Set Up uv
        uses: astral-sh/setup-uv@v6
      - name: Install Clang and CMake
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
        if: runner.os == 'Linux'
      - name: Check Formatting
        run: cargo fmt --all -- --check
      - name: Check Python Plotting
        run: uvx ruff check --target-version py311 --extend-select I scripts/plot.py && uvx ruff format --check scripts/plot.py
      - name: Lint Every Backend
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test Every Backend
        run: cargo test --locked --all-features
