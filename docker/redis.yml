services:
  redis:
    image: redis:8.10.2
    ports: ["127.0.0.1::6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 60
  valkey:
    image: valkey/valkey-bundle:9.1.2
    profiles: [valkey]
    ports: ["127.0.0.1::6379"]
    command: ["--save", "", "--appendonly", "no"]
  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v2.0.0
    profiles: [dragonfly]
    ports: ["127.0.0.1::6379"]
    command: ["--dir=/data", "--dbfilename=crudeval", "--snapshot_cron=", "--logtostderr"]
  garnet:
    image: crudeval-garnet-json:2.1.8
    build:
      context: .
      dockerfile: garnet-json.Dockerfile
    profiles: [garnet]
    ports: ["127.0.0.1::6379"]
    command: ["--lua", "--lua-transaction-mode", "--loadmodulecs", "/app/modules/GarnetJSON.dll", "--extension-bin-paths", "/app/modules", "--bind", "0.0.0.0", "--port", "6379", "--storage-tier", "--recover", "--logdir", "/data/log", "--checkpointdir", "/data/checkpoint"]
  kvrocks:
    image: apache/kvrocks:2.17.0
    profiles: [kvrocks]
    ports: ["127.0.0.1::6379"]
    command: ["--bind", "0.0.0.0", "--port", "6379", "--dir", "/data", "--rocksdb.write_options.disable_wal", "yes"]
volumes:
  redis-data:
